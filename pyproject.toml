[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "avac-desktop"
version = "0.1.5"
description = "Standalone desktop application for avalanche and impulse-wave modelling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "DISCLAIMER.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = ["PySide6==6.8.3", "numpy>=2,<3", "PyYAML==6.0.3", "matplotlib>=3.9,<4", "pyqtgraph==0.14.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.gui-scripts]
avac-desktop = "avac_desktop.app:main"

[project.urls]
Repository = "https://github.com/cgotelli/AVAC-Desktop"
Issues = "https://github.com/cgotelli/AVAC-Desktop/issues"

[tool.setuptools.packages.find]
include = ["avac_desktop*"]

[tool.setuptools.package-data]
avac_desktop = ["resources/*.json", "resources/*.yaml", "resources/*.png", "resources/*.svg", "resources/*.tar.gz"]
